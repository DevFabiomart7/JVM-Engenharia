name: Deploy JVM site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published version
        uses: actions/checkout@v6
        with:
          ref: main
          path: sources/main

      - name: Checkout version before the redesign
        uses: actions/checkout@v6
        with:
          ref: ab2058868b954410a3ccb1f2d3473197b62ef0f3
          path: sources/previous

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site/preview
          cp sources/main/index.html sources/main/sobre.html sources/main/servicos.html sources/main/cursos.html sources/main/contato.html _site/
          cp -R sources/main/css sources/main/js sources/main/assets _site/
          cp sources/previous/index.html _site/preview/
          cp -R sources/previous/css sources/previous/js sources/previous/assets _site/preview/
          touch _site/.nojekyll
          touch _site/preview/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
