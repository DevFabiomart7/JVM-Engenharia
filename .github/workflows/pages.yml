name: Deploy JVM site to GitHub Pages

on:
  push:
    branches:
      - main
      - refactor/MelhoriaDeAbas
  repository_dispatch:
    types:
      - preview-updated
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published version
        uses: actions/checkout@v6
        with:
          ref: main
          path: sources/main

      - name: Checkout preview version
        uses: actions/checkout@v6
        with:
          ref: refactor/MelhoriaDeAbas
          path: sources/preview

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site/preview
          cp sources/main/index.html _site/
          cp -R sources/main/css sources/main/js sources/main/assets _site/
          cp sources/preview/index.html sources/preview/sobre.html sources/preview/servicos.html sources/preview/cursos.html sources/preview/contato.html _site/preview/
          cp -R sources/preview/css sources/preview/js sources/preview/assets _site/preview/
          touch _site/.nojekyll
          touch _site/preview/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-main:
    if: github.ref == 'refs/heads/refactor/MelhoriaDeAbas'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Request Pages deployment from the default branch
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'preview-updated',
            });
